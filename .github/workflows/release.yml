name: Package release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  package:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag and source versions
        run: node scripts/check-release.mjs --tag
      - run: npm run build:all
      - run: npm run package
      - run: npm run package:chrome
      - run: npm run package:safari
      - name: Compile unsigned macOS and iOS applications
        run: |
          xcodebuild -project safari-build/Flickleaf/Flickleaf.xcodeproj -scheme 'Flickleaf (macOS)' -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project safari-build/Flickleaf/Flickleaf.xcodeproj -scheme 'Flickleaf (iOS)' -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Package reproducible source and web assets
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          git archive --format=zip --prefix=flickleaf-source/ --output="artifacts/flickleaf-source-$VERSION.zip" HEAD
          ditto -c -k --keepParent dist-web/flickleaf "artifacts/flickleaf-web-$VERSION.zip"
          shasum -a 256 artifacts/*.zip > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flickleaf-release-packages
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          gh release create "v$VERSION" artifacts/* --verify-tag --draft --title "Flickleaf $VERSION" --notes-file docs/release-notes-template.md
