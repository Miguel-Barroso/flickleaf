name: Feature request
description: Suggest an improvement to Flickleaf.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What reading task is difficult today?
      description: Describe your situation and device without sharing private documents.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help?
      description: Describe the result you want, and any workaround you currently use.
    validations:
      required: true
